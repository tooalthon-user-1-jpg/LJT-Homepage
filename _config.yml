# Welcome to Junteng Liu's personal homepage

Junteng Liu is a first-year PhD candidate at the HKUST NLP Group under Professor Junxian He. He graduated from Shanghai Jiao Tong University (SJTU) in June 2024. His research focuses on natural language processing and machine learning: LLM reasoning and reinforcement learning, hallucination in vision-language models, and LLM truthfulness and interpretability.

Junteng completed research internships at MINIMAX (February 2025 - Present), Tencent WXG (June 2024 - September 2024), and Shanghai AI Lab (June 2023 - December 2023). He received the Zhiyuan Honor Scholarship at SJTU.

